name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reaper-artifact-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Build OCI worker without publishing
        shell: bash
        run: |
          docker build \
            --build-arg BUILD_DATE="$(git show -s --format=%cI HEAD)" \
            --build-arg VERSION="$(node -p \"require('./package.json').version\")" \
            --build-arg VCS_REF="$EXPECTED_SHA" \
            --tag mochirii-reaper-gateway:ci \
            .
      - name: Verify OCI worker without provider access
        env:
          REAPER_CONTAINER_IMAGE: mochirii-reaper-gateway:ci
        run: bun run check:container
