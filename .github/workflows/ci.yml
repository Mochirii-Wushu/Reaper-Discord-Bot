name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reaper-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.4
      - name: Verify Deno release checksum
        env:
          DENO_BINARY_SHA256: 1d97ecaf9e6bbb2a99e991caaf64ba9d62bf98759e8ef9938b9005855772b017
        shell: bash
        run: |
          set -Eeuo pipefail
          deno_path="$(command -v deno)"
          printf '%s  %s\n' "$DENO_BINARY_SHA256" "$deno_path" | sha256sum --check --strict -
          deno --version | grep -F 'deno 2.9.4'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Build OCI worker without publishing
        shell: bash
        run: |
          docker build \
            --build-arg BUILD_DATE="$(git show -s --format=%cI HEAD)" \
            --build-arg VERSION="$(node -p "require('./package.json').version")" \
            --build-arg VCS_REF="$EXPECTED_SHA" \
            --tag mochirii-reaper-gateway:ci \
            .
      - name: Verify OCI worker without provider access
        env:
          REAPER_CONTAINER_IMAGE: mochirii-reaper-gateway:ci
        run: bun run check:container
      - name: Verify pinned converter without publishing
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=contract
          trap 'status=$?; printf "Converter preflight failed: phase=%s status=%s\n" "$stage" "$status" >&2; exit "$status"' ERR
          SKOPEO_IMAGE="$(node -p "require('./contracts/gateway-image-publication.v1.json').skopeoImage")"
          stage=pull
          docker pull --platform linux/amd64 "$SKOPEO_IMAGE"
          stage=converter-platform
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$SKOPEO_IMAGE")" = linux/amd64
          stage=scratch
          conversion="$(mktemp -d "$RUNNER_TEMP/reaper-converter.XXXXXXXX")"
          mkdir "$conversion/input" "$conversion/oci" "$conversion/docker" "$conversion/tmp"
          original_image_id="$(docker image inspect --format '{{.Id}}' mochirii-reaper-gateway:ci)"
          stage=original-identity
          docker image inspect --format '{{json .Config}}' mochirii-reaper-gateway:ci | head -c65537 > "$conversion/original-config.json"
          docker image inspect --format '{{json .RootFS}}' mochirii-reaper-gateway:ci | head -c65537 > "$conversion/original-rootfs.json"
          stage=save-worker
          docker save --output "$conversion/input/gateway.tar" mochirii-reaper-gateway:ci
          converter_args=(--rm --pull never --user "$(id -u):$(id -g)" --network none --read-only --cap-drop ALL --security-opt no-new-privileges --volume "$conversion/tmp:/var/tmp")
          stage=version-command
          docker run "${converter_args[@]}" "$SKOPEO_IMAGE" --version | head -c257 > "$conversion/version.txt"
          stage=version-evidence
          node -e 'const fs=require("node:fs");const file=process.argv[1];if(fs.statSync(file).size>256)throw Error("VERSION_SIZE");const bytes=fs.readFileSync(file);if(bytes.length>256)throw Error("VERSION_SIZE");const version=new TextDecoder("utf-8",{fatal:true}).decode(bytes);console.log("Converter version evidence: "+JSON.stringify(version));' "$conversion/version.txt"
          stage=version-match
          grep -Fx 'skopeo version 1.22.3 commit: 92397d5ba399784c6e2f9f229a4244b724743dba' "$conversion/version.txt"
          stage=docker-to-oci
          docker run "${converter_args[@]}" --volume "$conversion/input:/input:ro" --volume "$conversion/oci:/output" "$SKOPEO_IMAGE" --override-os linux --override-arch amd64 copy --format v2s2 docker-archive:/input/gateway.tar oci-archive:/output/gateway.oci.tar:ci
          stage=oci-to-docker
          docker run "${converter_args[@]}" --volume "$conversion/oci:/input:ro" --volume "$conversion/docker:/output" "$SKOPEO_IMAGE" --override-os linux --override-arch amd64 copy oci-archive:/input/gateway.oci.tar docker-archive:/output/gateway.tar:mochirii-reaper-gateway:converted
          stage=load-worker
          docker load --input "$conversion/docker/gateway.tar"
          stage=identity-evidence
          docker image inspect --format '{{json .Config}}' mochirii-reaper-gateway:converted | head -c65537 > "$conversion/converted-config.json"
          docker image inspect --format '{{json .RootFS}}' mochirii-reaper-gateway:converted | head -c65537 > "$conversion/converted-rootfs.json"
          node -e 'const fs=require("node:fs");const {isDeepStrictEqual:equal}=require("node:util");const read=file=>{try{if(fs.statSync(file).size>65536)throw Error();const bytes=fs.readFileSync(file);if(bytes.length>65536)throw Error();const value=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(bytes));if(!value||typeof value!=="object"||Array.isArray(value))throw Error();return value;}catch{throw Error("IDENTITY_EVIDENCE_INVALID");}};const [a,b,c,d]=process.argv.slice(1).map(read);const fields=[...new Set([...Object.keys(a),...Object.keys(b)])].sort();if(fields.length>128||fields.some(k=>!/^[A-Za-z][A-Za-z0-9_]{0,63}$/.test(k)))throw Error("IDENTITY_FIELD_NAMES");console.log("Converter identity evidence: "+JSON.stringify({configEqual:equal(a,b),rootfsEqual:equal(c,d),changedConfigFields:fields.filter(k=>!equal(a[k],b[k]))}));' "$conversion/original-config.json" "$conversion/converted-config.json" "$conversion/original-rootfs.json" "$conversion/converted-rootfs.json"
          stage=config-identity
          test "$(docker image inspect --format '{{.Id}}' mochirii-reaper-gateway:converted)" = "$original_image_id"
          stage=worker-platform
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' mochirii-reaper-gateway:converted)" = linux/amd64
          stage=offline-runtime
          REAPER_CONTAINER_IMAGE=mochirii-reaper-gateway:converted REAPER_EXPECTED_REVISION="$EXPECTED_SHA" bun run check:container
