name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reaper-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.4
      - name: Verify Deno release checksum
        env:
          DENO_BINARY_SHA256: 1d97ecaf9e6bbb2a99e991caaf64ba9d62bf98759e8ef9938b9005855772b017
        shell: bash
        run: |
          set -Eeuo pipefail
          deno_path="$(command -v deno)"
          printf '%s  %s\n' "$DENO_BINARY_SHA256" "$deno_path" | sha256sum --check --strict -
          deno --version | grep -F 'deno 2.9.4'
      - run: bun install --frozen-lockfile
      - run: bun run check
